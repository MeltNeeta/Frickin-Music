<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frickin Music</title>
    <link rel="stylesheet" href="frickinmusic.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <script>

        // 1. Data daftar lagu
const songs = [
    {
        title: "BANG BANG BANG - Chainsaw Man Song",
        artist: "bb-panzu",
        cover: "pict/bang bang bang.jpg",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        lyrics: "Lorem ipsum dolor sit amet, consectetur adipiscing elit.\nSed do eiusmod tempor incididunt ut labore et dolore magna aliqua.\nUt enim ad minim veniam, quis nostrud exercitation ullamco."
    },
    {
        title: "Judul Lagu 2",
        artist: "Artist 2",
        cover: "https://via.placeholder.com/300/d44 d5c/ffffff?text=Cover+2",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
        lyrics: "Duis aute irure dolor in reprehenderit in voluptate.\nVelit esse cillum dolore eu fugiat nulla pariatur.\nExcepteur sint occaecat cupidatat non proident."
    },
    {
        title: "Judul Lagu 3",
        artist: "Artist 3",
        cover: "https://via.placeholder.com/300/160029/ffffff?text=Cover+3",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
        lyrics: "Sunt in culpa qui officia deserunt mollit anim id est laborum.\nCurabitur pretium tincidunt lacus. Nulla gravida orci a odio."
    }
];

// 2. Mengambil elemen DOM
const audioPlayer = document.getElementById('audio-player');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const progressBar = document.getElementById('progress-bar');
const songTitle = document.getElementById('song-title');
const songArtist = document.getElementById('song-artist');
const songLyrics = document.getElementById('song-lyrics');
const coverImg = document.getElementById('cover-img');
const playlistContainer = document.getElementById('playlist');

let currentSongIndex = 0;
let isPlaying = false;

// 3. Menampilkan daftar lagu ke Sidebar
function loadPlaylist() {
    playlistContainer.innerHTML = '';
    songs.forEach((song, index) => {
        const card = document.createElement('div');
        card.classList.add('song-card');
        card.innerHTML = `
            <img src="${song.cover}" alt="${song.title}">
            <div class="song-card-info">
                <h4>${song.title}</h4>
                <p>${song.artist}</p>
            </div>
        `;
        // Klik lagu untuk memutar
        card.addEventListener('click', () => selectSong(index));
        playlistContainer.appendChild(card);
    });
}

// 4. Memuat lagu pilihan ke player
function loadSong(song) {
    songTitle.textContent = song.title;
    songArtist.textContent = song.artist;
    songLyrics.textContent = song.lyrics;
    coverImg.src = song.cover;
    audioPlayer.src = song.src;
}

// 5. Pilih lagu tertentu
function selectSong(index) {
    currentSongIndex = index;
    loadSong(songs[currentSongIndex]);
    playAudio();
}

// 6. Jalankan / Hentikan Musik (Play/Pause)
function playAudio() {
    isPlaying = true;
    audioPlayer.play();
    playIcon.textContent = 'pause';
}

function pauseAudio() {
    isPlaying = false;
    audioPlayer.pause();
    playIcon.textContent = 'play_arrow';
}

playBtn.addEventListener('click', () => {
    if (isPlaying) {
        pauseAudio();
    } else {
        playAudio();
    }
});

// 7. Update Progress Bar saat lagu berjalan
audioPlayer.addEventListener('timeupdate', () => {
    if (audioPlayer.duration) {
        const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressBar.value = progressPercent;
    }
});

// 8. Geser Progress Bar (Seek Lagu)
progressBar.addEventListener('input', () => {
    const seekTime = (progressBar.value / 100) * audioPlayer.duration;
    audioPlayer.currentTime = seekTime;
});

// 9. Otomatis putar lagu berikutnya jika lagu selesai
audioPlayer.addEventListener('ended', () => {
    currentSongIndex = (currentSongIndex + 1) % songs.length;
    loadSong(songs[currentSongIndex]);
    playAudio();
});

// Inisialisasi awal
loadPlaylist();
loadSong(songs[currentSongIndex]);

    </script>
</head>


<body>
    
    <nav class="navbar">
        <div class="logo">
            <img src="pict/Frickin Music Logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/70'"/>
            <h1>Frickin Music</h1>
        </div>

        <div class="account">
            <span class="material-symbols-outlined">person</span>
            <h1>Audrey Janeeta</h1>
        </div>
    </nav>

    <section class="main-body">

        <div class="row-music">
            <div class="your-musics">
                <h2>Your Musics</h2>
            </div>

            <div class="playlist-container" id="playlist">
                </div>
        </div>

        <div class="main-play">
            <div class="player-top">
                <div class="album-cover">
                    <img id="cover-img" src="https://via.placeholder.com/300" alt="Album Cover"/>
                </div>

                <div class="about">
                    <h1 id="song-title">Judul Lagu</h1>
                    <h3 id="song-artist">Artist / Singer</h3>

                    <div class="lyric-box">
                        <h3>Lyrics</h3>
                        <div class="lyric-content">
                            <p id="song-lyrics">Pilih lagu untuk menampilkan lirik...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="player-controls">
                <input type="range" id="progress-bar" value="0" min="0" step="0.1">
                <div class="control-btn-wrapper">
                    <button id="play-btn" class="play-btn">
                        <span class="material-symbols-outlined" id="play-icon">play_arrow</span>
                    </button>
                </div>
            </div>
        </div>

    </section>

    <audio id="audio-player"></audio>

</body>
</html>
